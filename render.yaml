services:
  - type: web
    name: stockbot
    env: python
    region: singapore       # closest free region to India
    plan: free
    buildCommand: pip install -r requirements.txt
    # gunicorn: single worker (threads share background threads safely), 2-min timeout
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --log-level info
    envVars:
      - key: WEB_HOST
        value: 0.0.0.0
      - key: MARKET
        value: NSE
      - key: TRADING_MODE
        value: simulation
      - key: WEB_DEBUG
        value: "false"
      - key: WEB_SECRET
        generateValue: true
      - key: INITIAL_CAPITAL
        value: "20000"
